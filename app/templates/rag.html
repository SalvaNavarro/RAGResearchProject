<!-- The main RAG user interface -->

{% extends "base.html" %} {% block body_class %}overflow-hidden{% endblock %} {% block content %}

<!-- Main content wrapper -->
<div class="flex h-[calc(100vh-7rem-5rem)] flex-col items-start gap-6 px-10 md:flex-row">
  <!-- Chat column -->
  <aside class="flex h-full w-full flex-col items-start justify-center md:w-1/3">
    <div class="flex h-10 w-full items-end py-2 text-2xl font-light">
      <h2 class="flex-grow">Ask</h2>
      <h4 class="text-xs">(Up to 2' for first answer to load)</h4>
    </div>

    <div class="flex h-full w-full flex-col border border-gray-300">
      <div id="messages" class="flex-1 overflow-y-auto border-b border-gray-200 p-2"></div>
      <div class="flex p-2">
        <input
          id="input"
          type="text"
          placeholder="Type your message..."
          autocomplete="off"
          class="min-w-0 flex-1 border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black"
        />
        <button
          id="send"
          class="ml-2 flex-none bg-black px-4 py-2 text-white hover:bg-black focus:outline-none focus:ring-2 focus:ring-black"
        >
          Send
        </button>
      </div>
    </div>
  </aside>

  <!-- Grid column -->
  <main class="flex h-full min-h-0 w-full flex-col overflow-hidden md:w-2/3">
    <div class="flex h-10 w-full items-end py-2 text-2xl font-light">
      <h2 id="results" class="flex-grow">Projects</h2>
      <a id="see-all" href="/rag"><h4 class="text-xl">See all</h4></a>
    </div>

    <div id="grid-container" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden">
      <div id="grid" class="grid grid-cols-1 gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
        {% include "project_thumbs.html" %}
      </div>
    </div>
  </main>
</div>

{% endblock %}
