{% extends 'base.html' %} {% block content %}

<div class="mx-auto mt-20 flex max-w-6xl flex-col items-center space-y-6 py-8">
  <div class="flex max-w-xl flex-col items-center space-y-6 py-8">
    <h1 class="text-2xl font-bold text-black">{{ name }}</h1>
    <p>{{ summary }}</p>
  </div>

  {% for image in images %}
  <div class="w-full overflow-hidden rounded-lg shadow-lg">
    <div class="relative">
      <img
        src="{{ url_for('static', filename=image) }}"
        alt="{{ image }}"
        class="h-auto w-full object-cover"
      />

      <!-- <div class="absolute bottom-0 left-0 bg-black bg-opacity-60 text-white text-xs p-2">
          {{ image }}
        </div> -->
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
